app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600
  encryption:
    password: ${APP_ENCRYPTION_PASSWORD}
    salt: ${APP_ENCRYPTION_SALT}
  images:
    product-placeholder: ${APP_PRODUCT_PLACEHOLDER_IMAGE:https://placehold.co/600x400?text=No+Image}
  site:
    name: ${APP_SITE_NAME:Digilo}
    company-name: ${APP_COMPANY_NAME:Digilo}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    support-url: ${APP_SUPPORT_URL:http://localhost:3000/support}
    
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 15

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      timeout: 60000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-secret: ${JWT_REFRESH_SECRET}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: digilo

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL}

midtrans:
  server-key: ${MIDTRANS_SERVER_KEY}
  client-key: ${MIDTRANS_CLIENT_KEY}
  base-url: https://api.sandbox.midtrans.com
  production: false

waha:
  base-url: ${WAHA_BASE_URL}
  api-key: ${WAHA_API_KEY}
  session: ${WAHA_SESSION:default}

google:
  client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    org.hibernate.SQL: info
    org.springframework.security: info