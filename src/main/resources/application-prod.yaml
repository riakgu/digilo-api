app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  encryption:
    password: ${APP_ENCRYPTION_PASSWORD}
    salt: ${APP_ENCRYPTION_SALT}
  images:
    product-placeholder: ${APP_PRODUCT_PLACEHOLDER_IMAGE}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      timeout: 60000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-secret: ${JWT_REFRESH_SECRET}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: digilo

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL}

midtrans:
  server-key: ${MIDTRANS_SERVER_KEY}
  client-key: ${MIDTRANS_CLIENT_KEY}
  base-url: https://api.midtrans.com
  production: true

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn
