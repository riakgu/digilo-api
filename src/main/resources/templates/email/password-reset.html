<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>

<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #ffffff; border-radius: 8px; padding: 30px;">
        <h2 style="color: #333; margin-bottom: 20px;">Password Reset</h2>
        <p style="color: #666;">Your password reset code is:</p>
        <div style="background-color: #f5f5f5; padding: 20px; text-align: center; border-radius: 8px; margin: 20px 0;">
            <span style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #333;"
                th:text="${otp}">123456</span>
        </div>
        <p style="color: #666;">This code will expire in <strong th:text="${expiryMinutes}">5</strong> minutes.</p>
        <p style="color: #666;">If you didn't request this, please ignore this email.</p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="color: #999; font-size: 12px;">Digilo - Digital Product Marketplace</p>
    </div>
</body>

</html>
