<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Order Failed</title>
</head>

<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #ffffff; border-radius: 8px; padding: 30px;">
        <h2 style="color: #333; margin-bottom: 20px;">❌ Order Failed</h2>

        <p style="color: #666;">Your order could not be processed.</p>

        <div style="background-color: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0;">
            <p style="margin: 5px 0;"><strong>Order Number:</strong> <span th:text="${orderNumber}">ORD-123456</span>
            </p>
            <p style="margin: 5px 0;"><strong>Reason:</strong> <span th:text="${reason}">Payment expired</span></p>
        </div>

        <p style="color: #666;">Please try again or contact our support if you need assistance.</p>

        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="color: #999; font-size: 12px;">Digilo - Digital Product Marketplace</p>
    </div>
</body>

</html>
