app:
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600
  rate-limit:
    default-limit: 1000
    authenticated-limit: 1000
    auth-endpoint-limit: 100
    window-seconds: 60
  encryption:
    password: test-encryption-password
    salt: 1234567890abcdef
  images:
    product-placeholder: https://placehold.co/600x400?text=No+Image
  site:
    name: Digilo Test
    company-name: Digilo Test
    frontend-url: http://localhost:3000
    support-url: http://localhost:3000/support

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digilo_test}
    username: ${SPRING_DATASOURCE_USERNAME:digilo}
    password: ${SPRING_DATASOURCE_PASSWORD:digilo123}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000ms

  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

  mail:
    host: localhost
    port: 25
    username: test@test.com
    password: testpassword
    test-connection: false

jwt:
  access-secret: test-access-secret-for-testing-only
  access-expiration: 3600000
  refresh-secret: test-refresh-secret-for-testing-only
  refresh-expiration: 86400000
  issuer: digilo-test

cloudflare:
  r2:
    account-id: test-account-id
    access-key-id: test-key
    secret-access-key: test-secret
    bucket-name: digilo-test
    public-url: https://test.r2.dev

midtrans:
  server-key: SB-Mid-server-test
  client-key: SB-Mid-client-test
  base-url: https://api.sandbox.midtrans.com
  production: false

waha:
  base-url: http://localhost:3000
  api-key: test-waha-api-key
  session: default

google:
  client-id: test-google-client-id

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn